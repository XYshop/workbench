server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # 应用统一挂在 /workbench/ 路径下（与 vite base 一致）
  location = /workbench {
    return 302 /workbench/;
  }
  location /workbench/ {
    alias /usr/share/nginx/html/;
  }
}